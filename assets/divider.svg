<svg xmlns="http://www.w3.org/2000/svg" width="840" height="12" viewBox="0 0 840 12" role="img" aria-label=""><title></title><style>
text{font-family:JB,"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:#cdd6f4}
.up{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .8s ease both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.pulse{animation:pulse 4s ease-in-out infinite}
.blink{animation:blink 1.1s step-end infinite}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs></defs><clipPath id="c"><rect width="840" height="12"/></clipPath><line x1="0" x2="840" y1="6" y2="6" stroke="#37384a"/><g clip-path="url(#c)"><rect y="5" width="140" height="2" rx="1" fill="#cba6f7"><animate attributeName="x" values="-140;840" dur="5s" repeatCount="indefinite"/></rect></g></svg>