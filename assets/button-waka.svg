<svg xmlns="http://www.w3.org/2000/svg" width="127" height="40" viewBox="0 0 127 40" role="img" aria-label="WakaTime"><title>WakaTime</title><style>@font-face{font-family:JB;font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
